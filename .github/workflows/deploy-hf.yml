name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://yuriassuncx:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          git remote add hf https://huggingface.co/spaces/yuriassuncx/deco-openai-storefront-mcp
          git push hf main --force
